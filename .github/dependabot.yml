version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Taipei"
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns:
          - "*"
