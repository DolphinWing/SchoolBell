name: OSV Security Audit

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 TST)
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle.properties'

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Get short SHA
      id: short_sha
      run: echo "sha_short=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Google Services JSON
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
        fi

    - name: Generate Dependency Locks
      run: |
        cat > /tmp/deps-lock.init.gradle << 'EOF'
        allprojects {
          dependencyLocking {
            lockAllConfigurations()
          }
        }
        EOF
        ./gradlew :app:dependencies --write-locks --no-daemon \
          --init-script /tmp/deps-lock.init.gradle

    - name: Debug - List generated lockfiles
      if: always()
      run: find . -name "*.lockfile" -o -name "gradle.lockfile" 2>/dev/null || echo "No lockfiles found"

    - name: Install and Run OSV-Scanner CLI
      id: osv_scan
      continue-on-error: true
      run: |
        curl -sSfL \
          https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
          -o osv-scanner
        chmod +x osv-scanner
        ./osv-scanner --lockfile=app/gradle.lockfile \
          --format=sarif \
          --output-file=results.sarif

    - name: Upload SARIF to GitHub Security Tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    - name: Send Discord Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ steps.osv_scan.outcome == 'failure' && 'failure' || 'success' }}
        title: "${{ steps.osv_scan.outcome == 'failure' && '🚨 OSV Security Audit - Vulnerabilities Found' || '✅ OSV Security Audit - Clean' }}"
        nodetail: true
        url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        description: "${{ github.repository }} [${{ steps.short_sha.outputs.sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) (Trigger: ${{ github.event_name }})"
