name: OSV Security Audit

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 TST)
    - cron: '0 0 * * 1'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle.properties'

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v6

    - name: Get short SHA
      id: short_sha
      run: echo "sha_short=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Google Services JSON
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
        fi

    - name: Generate Dependency Locks
      run: ./gradlew dependencies --write-locks --no-daemon

    - name: Install and Run OSV-Scanner CLI
      run: |
        curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
        chmod +x osv-scanner
        ./osv-scanner -r --format=sarif --output=results.sarif .

    - name: Upload SARIF to GitHub Security Tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

    - name: Send Discord Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        title: "🛡️ OSV Security Audit"
        nodetail: true
        url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        description: "${{ github.repository }} [${{ steps.short_sha.outputs.sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) (Trigger: ${{ github.event_name }})"
