name: OSV Security Audit

on:
  schedule:
    # Every Saturday at 09:25 CST/TST (Saturday 01:25 UTC)
    - cron: '25 1 * * 6'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/build.gradle.kts'
      - 'gradle.properties'

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get short SHA
      id: short_sha
      run: echo "sha_short=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Google Services JSON
      run: |
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json
        fi

    - name: Generate Dependency Locks (Release Runtime Only)
      run: |
        cat > /tmp/deps-lock.init.gradle << 'EOF'
        allprojects {
          dependencyLocking {
            lockAllConfigurations()
          }
        }
        EOF
        ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks --no-daemon \
          --init-script /tmp/deps-lock.init.gradle

    - name: Debug - List generated lockfiles
      if: always()
      run: find . -name "*.lockfile" -o -name "gradle.lockfile" 2>/dev/null || echo "No lockfiles found"

    - name: Install and Run OSV-Scanner CLI
      id: osv_scan
      continue-on-error: true
      run: |
        curl -sSfL \
          https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
          -o osv-scanner
        chmod +x osv-scanner

        SCAN_EXIT=0
        ./osv-scanner --lockfile=app/gradle.lockfile --format=sarif --output-file=results.sarif || SCAN_EXIT=$?
        ./osv-scanner --lockfile=app/gradle.lockfile --format=markdown --output-file=results.md || true

        if [ -s results.md ]; then
          {
            echo "### OSV Security Audit"
            cat results.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat results.md
        fi

        SCAN_EXIT="${SCAN_EXIT}" python3 - << 'PY'
        import json
        import os

        scan_exit = int(os.environ.get("SCAN_EXIT", "1"))
        lines = []
        if os.path.exists("results.sarif"):
            try:
                with open("results.sarif", "r", encoding="utf-8") as f:
                    data = json.load(f)
                results = [
                    r
                    for run in data.get("runs", [])
                    for r in run.get("results", [])
                ]
                for r in results[:10]:
                    rule_id = r.get("ruleId", "UNKNOWN")
                    msg_text = (r.get("message", {}).get("text", "") or "").splitlines()
                    first_line = msg_text[0] if msg_text else ""
                    lines.append(f"- `{rule_id}`: {first_line}" if first_line else f"- `{rule_id}`")
                if len(results) > 10:
                    lines.append(f"...and {len(results) - 10} more (see Actions Summary).")
            except Exception as exc:
                lines.append(f"Failed to parse results.sarif: {exc}")

        if not lines:
            if scan_exit == 0:
                lines.append("No vulnerabilities found in app/gradle.lockfile.")
            else:
                lines.append(f"OSV-Scanner exited with code {scan_exit} (see workflow logs).")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"exit_code={scan_exit}\n")
            out.write("summary<<OSV_SUMMARY_EOF\n")
            out.write("\n".join(lines) + "\n")
            out.write("OSV_SUMMARY_EOF\n")
        PY

        exit "${SCAN_EXIT}"

    - name: Upload SARIF to GitHub Security Tab
      if: always() && hashFiles('results.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
        category: osv-scanner
      continue-on-error: true

    - name: Send Discord Notification
      if: always()
      uses: sarisia/actions-status-discord@v1
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ (steps.osv_scan.outputs.exit_code == '0' && job.status == 'success') && 'success' || 'failure' }}
        title: "${{ steps.osv_scan.outputs.exit_code == '1' && '🚨 OSV Security Audit - Vulnerabilities Found' || ((steps.osv_scan.outputs.exit_code == '0' && job.status == 'success') && '✅ OSV Security Audit - Clean' || '❌ OSV Security Audit - Workflow Error') }}"
        nodetail: true
        url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        description: |
          ${{ github.repository }} [${{ steps.short_sha.outputs.sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) (Trigger: ${{ github.event_name }})
          ${{ steps.osv_scan.outputs.summary || 'Scan did not complete (check workflow logs).' }}
