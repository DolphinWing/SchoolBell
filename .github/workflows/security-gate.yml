name: Security Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-gate:
    name: Secrets & SAST Gatekeeper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: Get short SHA
        id: short_sha
        run: echo "sha_short=$(git rev-parse --short=6 HEAD)" >> $GITHUB_OUTPUT

      # 1. 檢查金鑰與機密洩漏 (Gitleaks)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 檢查程式碼安全弱點 (原生 Python Semgrep，免 Docker)
      - name: Run Semgrep SAST
        id: semgrep_scan
        run: |
          python3 -m pip install --upgrade pip semgrep
          semgrep scan \
            --config "p/security-audit" \
            --config "p/secrets" \
            --sarif-output=semgrep.sarif

      # 3. 將掃描結果同步至 GitHub Security Tab
      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
        
      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ steps.semgrep_scan.outcome == 'failure' && 'failure' || 'success' }}
          title: "${{ steps.semgrep_scan.outcome == 'failure' && '🚨 Semgrep OSS - Found' || '✅ Semgrep OSS - Clean' }}"
          nodetail: true
          url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          description: "${{ github.repository }} [${{ steps.short_sha.outputs.sha_short }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) (Trigger: ${{ github.event_name }})"

